<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>여행영어 실전 대사집 - 롤플레이 & 스피킹 훈련</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --role-a-bg: #fce7f3;
      --role-a-text: #be185d;
      --role-b-bg: #dbeafe;
      --role-b-text: #1d4ed8;
      --en-bg: #f1f5f9;
      --note-bg: #fffbeb;
      --note-border: #fde68a;
      --note-text: #92400e;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --extra-header-bg: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px 14px 60px;
    }
    .container { max-width: 820px; margin: 0 auto; }

    /* Navigation */
    .nav-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }
    .situation-select {
      flex: 1; min-width: 220px; padding: 10px 14px;
      font-size: 0.95rem; font-weight: 700; color: var(--text-main);
      background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px;
      cursor: pointer; outline: none;
    }
    .nav-btns { display: flex; gap: 6px; }
    .nav-btn {
      border: 1px solid var(--border); background: #ffffff; color: var(--text-main);
      padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: #f1f5f9; }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Header */
    header {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 22px 24px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .category-badge {
      font-size: 0.8rem; font-weight: 700; color: var(--primary);
      background: #eff6ff; padding: 4px 12px; border-radius: 999px; border: 1px solid #bfdbfe;
    }
    .voice-status { font-size: 0.78rem; color: var(--text-sub); background: #f1f5f9; padding: 4px 12px; border-radius: 999px; }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
    .subtitle { font-size: 0.9rem; color: var(--text-sub); }

    /* Controls */
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .btn {
      border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main);
      padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); color: #ffffff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary.playing { background: #dc2626; border-color: #dc2626; }

    /* Section Titles */
    .section-title {
      font-size: 1.1rem; font-weight: 800; color: var(--text-main);
      margin: 26px 0 12px; display: flex; align-items: center; gap: 8px;
    }

    /* Dialogue & Extra Item Cards */
    .item-list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    }
    .card.success-card { border-color: var(--success); background: #f0fdf4; }

    .card-header {
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; cursor: pointer; user-select: none;
    }
    .card-header:hover { background: #f8fafc; }
    .header-left { display: flex; align-items: center; gap: 10px; flex: 1; flex-wrap: wrap; }
    .toggle-icon { font-size: 0.8rem; color: var(--text-sub); transition: transform 0.2s ease; width: 16px; text-align: center; }
    .card.open .toggle-icon { transform: rotate(90deg); color: var(--primary); }

    .role-badge { font-size: 0.78rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .role-A { background: var(--role-a-bg); color: var(--role-a-text); }
    .role-B { background: var(--role-b-bg); color: var(--role-b-text); }
    .role-EXTRA { background: #e2e8f0; color: #334155; }
    .kr-text { font-size: 1.02rem; font-weight: 700; }

    .speak-practice-btn {
      border: 1px solid #fbcfe8; background: #fdf2f8; color: #db2777;
      padding: 3px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    }
    .speak-practice-btn:hover { background: #db2777; color: #ffffff; }
    .speak-practice-btn.listening { background: #dc2626; color: #ffffff; border-color: #dc2626; }

    .card-body {
      display: none; padding: 12px 16px 16px 42px;
      border-top: 1px dashed var(--border); background: #fcfdff;
    }
    .card.open .card-body { display: block; }

    .en-box {
      background: var(--en-bg); padding: 12px 14px; border-radius: 8px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .en-text { font-size: 1.08rem; font-weight: 800; color: #1e293b; }
    .speak-audio-btn {
      border: 1px solid #cbd5e1; background: #ffffff; color: var(--text-main);
      padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .speak-audio-btn:hover { background: var(--primary); color: #ffffff; }

    .feedback-box {
      margin-bottom: 8px; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; display: none;
    }
    .feedback-success { background: var(--success-bg); color: var(--success); border: 1px solid #bbf7d0; }
    .feedback-retry { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

    .note-box {
      margin-top: 8px; background: var(--note-bg); border: 1px solid var(--note-border);
      color: var(--note-text); padding: 8px 12px; border-radius: 8px; font-size: 0.86rem;
    }

    /* Tip Footer Card */
    .tip-card {
      margin-top: 24px; background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 12px; padding: 14px 18px; color: #1e3a8a; font-size: 0.92rem; font-weight: 500;
    }
    .tip-title { font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }

    @media (max-width: 600px) {
      .card-body { padding: 12px 14px 14px; }
      .nav-bar { flex-direction: column; align-items: stretch; }
      .nav-btn { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <select id="situationSelect" class="situation-select" onchange="selectSituationByIndex(this.value)"></select>
      <div class="nav-btns">
        <button id="prevBtn" class="nav-btn" onclick="moveSituation(-1)">◀ 이전</button>
        <button id="nextBtn" class="nav-btn" onclick="moveSituation(1)">다음 ▶</button>
      </div>
    </div>

    <header>
      <div class="header-top">
        <span id="categoryBadge" class="category-badge">TRAVEL ENGLISH</span>
        <span id="voiceStatus" class="voice-status">음성 준비 중...</span>
      </div>
      <h1 id="situationTitle">로딩 중...</h1>
      <p class="subtitle">한글 문장을 보고 [말하기 🎤]로 스피킹 채점을 하거나, 카드를 눌러 영문을 확인하세요.</p>
    </header>

    <div class="controls">
      <button id="playAllBtn" class="btn btn-primary" onclick="togglePlayAll()">▶ 대화 연속 듣기</button>
      <button class="btn" onclick="expandAll()">전체 펼치기</button>
      <button class="btn" onclick="collapseAll()">전체 접기</button>
    </div>

    <!-- 1. 영상 속 실전 대사 섹션 -->
    <div class="section-title">🎬 영상 속 실전 대화</div>
    <div id="dialogueContainer" class="item-list"></div>

    <!-- 2. 독립된 추가 표현 섹션 (한글 먼저-토글 영문) -->
    <div class="section-title">➕ 함께 익히면 좋은 추가 표현</div>
    <div id="extraContainer" class="item-list"></div>

    <!-- 상황별 TIP 카드 -->
    <div id="tipContainer"></div>
  </div>

  <script src="data.js"></script>
  <script>
    let currentIndex = 0;
    let femaleVoice = null;
    let maleVoice = null;
    let isPlayingAll = false;
    let currentPlayIndex = 0;

    function initApp() {
      if (typeof situationsData === "undefined" || !Array.isArray(situationsData) || situationsData.length === 0) {
        document.getElementById("dialogueContainer").innerHTML = `<div style="padding:20px;text-align:center;">⚠️ data.js 파일을 찾을 수 없습니다.</div>`;
        return;
      }
      const savedId = Number(localStorage.getItem("lastSituationId"));
      const foundIdx = situationsData.findIndex(item => item.id === savedId);
      currentIndex = foundIdx !== -1 ? foundIdx : 0;
      initDropdown();
      selectSituationByIndex(currentIndex);
    }

    function initDropdown() {
      const selectEl = document.getElementById("situationSelect");
      selectEl.innerHTML = situationsData.map((item, idx) => {
        const numStr = String(item.id).padStart(2, "0");
        return `<option value="${idx}">${numStr}. [${item.category}] ${item.title}</option>`;
      }).join("");
      selectEl.value = currentIndex;
    }

    function selectSituationByIndex(index) {
      stopPlayAll();
      currentIndex = Number(index);
      const currentItem = situationsData[currentIndex];
      if (!currentItem) return;

      localStorage.setItem("lastSituationId", currentItem.id);
      document.getElementById("situationSelect").value = currentIndex;

      const numStr = String(currentItem.id).padStart(2, "0");
      document.getElementById("categoryBadge").textContent = `SITUATION ${numStr} · ${currentItem.category} (${currentItem.page || ''})`;
      document.getElementById("situationTitle").textContent = `${numStr}. ${currentItem.title}`;

      document.getElementById("prevBtn").disabled = currentIndex <= 0;
      document.getElementById("nextBtn").disabled = currentIndex >= situationsData.length - 1;

      renderContent(currentItem);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function moveSituation(delta) {
      const nextIdx = currentIndex + delta;
      if (nextIdx >= 0 && nextIdx < situationsData.length) selectSituationByIndex(nextIdx);
    }

    function loadVoices() {
      const voices = window.speechSynthesis.getVoices();
      const enVoices = voices.filter(v => v.lang.startsWith("en"));
      femaleVoice = enVoices.find(v => /Google US English|Aria|Jenny|Samantha|Zira/i.test(v.name)) || enVoices[0] || null;
      maleVoice = enVoices.find(v => /Google US English|David|Guy|Christopher|Alex/i.test(v.name)) || enVoices[1] || enVoices[0] || null;
      document.getElementById("voiceStatus").textContent = enVoices.length > 0 ? "음성 엔진 준비 완료" : "기본 음성 사용";
    }
    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function renderCard(item, prefixId) {
      return `
        <div class="card" id="card-${prefixId}">
          <div class="card-header" onclick="toggleCard('${prefixId}')">
            <div class="header-left">
              <span class="toggle-icon">▶</span>
              <span class="role-badge role-${item.role}">${item.roleLabel}</span>
              <span class="kr-text">${item.kr}</span>
              <button class="speak-practice-btn" id="mic-${prefixId}" onclick="event.stopPropagation(); startSpeechTest('${prefixId}', '${item.en.replace(/'/g, "\\'")}')">말하기 🎤</button>
            </div>
          </div>
          <div class="card-body">
            <div class="feedback-box" id="feedback-${prefixId}"></div>
            <div class="en-box">
              <span class="en-text">${item.en}</span>
              <button class="speak-audio-btn" onclick="event.stopPropagation(); speakSentence('${item.en.replace(/'/g, "\\'")}', '${item.role}')">🔊 발음 듣기</button>
            </div>
            ${item.note ? `<div class="note-box">${item.note}</div>` : ''}
          </div>
        </div>
      `;
    }

    function renderContent(situationItem) {
      // 1. 영상 속 실전 대사 렌더링
      const dContainer = document.getElementById("dialogueContainer");
      if (situationItem.dialogues && situationItem.dialogues.length > 0) {
        dContainer.innerHTML = situationItem.dialogues.map((item, idx) => renderCard(item, `d-${idx}`)).join("");
      } else {
        dContainer.innerHTML = `<div style="color:var(--text-sub);padding:10px;">대사 데이터 준비 중입니다.</div>`;
      }

      // 2. 추가 표현 독립 렌더링 (한글 우선-토글형)
      const eContainer = document.getElementById("extraContainer");
      if (situationItem.extras && situationItem.extras.length > 0) {
        eContainer.innerHTML = situationItem.extras.map((ex, idx) => {
          const extraItem = { role: "EXTRA", roleLabel: "추가", kr: ex.kr, en: ex.en, note: "" };
          return renderCard(extraItem, `e-${idx}`);
        }).join("");
      } else {
        eContainer.innerHTML = `<div style="color:var(--text-sub);padding:10px;">추가 표현이 없습니다.</div>`;
      }

      // 3. 교재 전용 학습 TIP 렌더링
      const tipContainer = document.getElementById("tipContainer");
      if (situationItem.tip) {
        tipContainer.innerHTML = `
          <div class="tip-card">
            <div class="tip-title">💡 SITUATION TIP</div>
            <div>${situationItem.tip}</div>
          </div>
        `;
      } else {
        tipContainer.innerHTML = "";
      }
    }

    function toggleCard(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) card.classList.toggle("open");
    }

    function expandAll() {
      document.querySelectorAll(".card").forEach(c => c.classList.add("open"));
    }
    function collapseAll() {
      document.querySelectorAll(".card").forEach(c => c.classList.remove("open"));
    }

    function speakSentence(text, role = "A", onEnd = null) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = 0.95;
      if (role === "B") {
        if (maleVoice) utter.voice = maleVoice;
        utter.pitch = 0.88;
      } else {
        if (femaleVoice) utter.voice = femaleVoice;
        utter.pitch = 1.1;
      }
      if (onEnd) { utter.onend = onEnd; utter.onerror = onEnd; }
      window.speechSynthesis.speak(utter);
    }

    function startSpeechTest(id, targetText) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("이 브라우저는 음성 인식을 지원하지 않습니다. 크롬 브라우저를 사용해 주세요.");
        return;
      }
      const micBtn = document.getElementById(`mic-${id}`);
      const card = document.getElementById(`card-${id}`);
      const feedback = document.getElementById(`feedback-${id}`);

      micBtn.classList.add("listening");
      micBtn.textContent = "🎙️ 듣는 중...";

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onresult = function(event) {
        const spoken = event.results[0][0].transcript;
        const cleanTarget = targetText.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim();
        const cleanSpoken = spoken.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim();

        micBtn.classList.remove("listening");
        micBtn.textContent = "말하기 🎤";
        feedback.style.display = "block";

        if (cleanTarget === cleanSpoken || cleanTarget.includes(cleanSpoken) || cleanSpoken.includes(cleanTarget)) {
          feedback.className = "feedback-box feedback-success";
          feedback.innerHTML = `🎉 완벽합니다! (인식: "${spoken}")`;
          card.classList.add("open", "success-card");
        } else {
          feedback.className = "feedback-box feedback-retry";
          feedback.innerHTML = `💪 내 발음: "${spoken}" (카드를 열어 정답을 확인해보세요)`;
          card.classList.add("open");
          card.classList.remove("success-card");
        }
      };

      recognition.onerror = function() {
        micBtn.classList.remove("listening");
        micBtn.textContent = "말하기 🎤";
        feedback.style.display = "block";
        feedback.className = "feedback-box feedback-retry";
        feedback.textContent = "음성을 인식하지 못했습니다. 다시 시도해 주세요.";
      };
      recognition.onend = function() {
        micBtn.classList.remove("listening");
        micBtn.textContent = "말하기 🎤";
      };
      recognition.start();
    }

    function togglePlayAll() {
      const item = situationsData[currentIndex];
      if (!item || !item.dialogues || item.dialogues.length === 0) return;
      const btn = document.getElementById("playAllBtn");
      if (isPlayingAll) { stopPlayAll(); return; }
      isPlayingAll = true; currentPlayIndex = 0;
      btn.classList.add("playing"); btn.textContent = "⏹ 연속 듣기 정지";
      playNext();
    }
    function stopPlayAll() {
      isPlayingAll = false;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      const btn = document.getElementById("playAllBtn");
      if (btn) { btn.classList.remove("playing"); btn.textContent = "▶ 대화 연속 듣기"; }
    }
    function playNext() {
      const item = situationsData[currentIndex];
      if (!isPlayingAll || !item || currentPlayIndex >= item.dialogues.length) { stopPlayAll(); return; }
      const line = item.dialogues[currentPlayIndex];
      const card = document.getElementById(`card-d-${currentPlayIndex}`);
      if (card) { card.classList.add("open"); card.scrollIntoView({ behavior: "smooth", block: "center" }); }
      speakSentence(line.en, line.role, () => {
        if (!isPlayingAll) return;
        currentPlayIndex++;
        setTimeout(playNext, 500);
      });
    }

    initApp();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실전 여행 영어 - AI 롤플레이 & 말하기 트레이너</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #f0f9ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --role-a: #0ea5e9;
      --role-b: #f59e0b;
      --role-extra: #64748b;
      --success: #059669;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 16px;
      line-height: 1.6;
    }

    .container { max-width: 820px; margin: 0 auto; }

    header {
      background: var(--card-bg);
      padding: 20px 22px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.06);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0369a1;
    }

    /* 이전/다음 버튼과 셀렉트박스를 감싸는 영역 */
    .nav-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .lecture-select-box {
      flex: 1;
      min-width: 0;
    }

    select {
      width: 100%;
      padding: 9px 12px;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 10px;
      border: 2px solid var(--primary);
      background-color: #fff;
      color: var(--primary);
      outline: none;
      cursor: pointer;
    }

    .btn-nav-custom {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .btn-nav-custom:hover:not(:disabled) {
      background-color: #e0f2fe;
    }
    .btn-nav-custom:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .desc { font-size: 0.9rem; color: var(--text-sub); }

    .voice-status {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.8rem;
      padding: 4px 12px;
      background: #f0f9ff;
      border-radius: 20px;
      color: #0369a1;
    }

    /* 툴바 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: white;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 9px 15px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-primary.playing { background-color: var(--danger); }

    .btn-secondary { background-color: #f1f5f9; color: #334155; }
    .btn-secondary:hover { background-color: #e2e8f0; }

    /* 섹션 제목 */
    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1e293b;
      margin: 24px 0 12px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 다이얼로그 카드 */
    .dialogue-list { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px 20px;
      border: 2px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: all 0.25s ease;
    }

    .card.active-playing {
      border-color: var(--primary);
      background-color: #f0f9ff;
    }

    .card-main-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .kr-container { display: flex; align-items: flex-start; gap: 10px; flex: 1; }

    .toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: var(--primary-light);
      color: var(--primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .card.open .toggle-btn {
      transform: rotate(90deg);
      background-color: var(--primary);
      color: white;
    }

    .speaker-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      color: white;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .speaker-A { background-color: var(--role-a); }
    .speaker-B { background-color: var(--role-b); }
    .speaker-EXTRA { background-color: var(--role-extra); }

    .kr-text-wrap { flex: 1; }
    .kr-text { font-size: 1.1rem; font-weight: 700; color: #0f172a; line-height: 1.45; }

    .actions-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn-record {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .btn-record:hover { background-color: #fee2e2; }
    .btn-record.recording {
      background-color: #dc2626;
      color: white;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* 말하기 분석 결과 패널 */
    .analysis-panel {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
    }
    .analysis-panel.show { display: block; }

    .panel-header {
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .score-badge { padding: 2px 8px; border-radius: 20px; font-weight: 800; }
    .score-high { background: #dcfce7; color: #15803d; }
    .score-mid { background: #fef3c7; color: #b45309; }
    .score-low { background: #fee2e2; color: #b91c1c; }

    .speech-transcript { font-size: 0.95rem; margin-bottom: 8px; color: #334155; }
    .diff-box {
      font-size: 0.92rem;
      padding: 8px 12px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      line-height: 1.5;
    }
    .match-word { color: #16a34a; font-weight: 700; }
    .miss-word { color: #dc2626; text-decoration: line-through; margin-right: 4px; }

    /* 영어 정답 패널 */
    .en-panel {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }
    .card.open .en-panel { display: block; }

    .en-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .en-text { font-size: 1.15rem; font-weight: 700; color: #0f172a; }

    .btn-tts {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 6px 11px;
      font-size: 0.85rem;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .btn-tts:hover { background-color: #e0f2fe; }

    .note-box {
      background-color: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .note-title { font-weight: 700; margin-bottom: 4px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-top">
      <h1 id="lectureTitle">✈️ 실전 여행 영어 회화</h1>
    </div>

    <div class="nav-toolbar">
      <button id="headerPrevBtn" class="btn-nav-custom" onclick="navLecture(-1)" title="이전 상황">◀ 이전</button>
      <div class="lecture-select-box">
        <select id="lectureSelect" onchange="changeLecture(this.value)"></select>
      </div>
      <button id="headerNextBtn" class="btn-nav-custom" onclick="navLecture(1)" title="다음 상황">다음 ▶</button>
    </div>

    <p class="desc">상황별 표현을 보고 [🎙️ 말하기]를 눌러 영작을 시도해 보세요. 3초간 말이 없거나 버튼을 누르면 즉시 채점됩니다.</p>
    <div id="voiceStatus" class="voice-status">음성 엔진 준비 중...</div>
  </header>

  <div class="toolbar">
    <div class="btn-group">
      <button id="playAllBtn" class="btn-primary" onclick="togglePlayAll()">
        ▶ 대화 전체 연속 듣기 (역할 롤플레이)
      </button>
    </div>
    <div class="btn-group">
      <button class="btn-secondary" onclick="toggleAllCards(true)">전체 정답 열기</button>
      <button class="btn-secondary" onclick="toggleAllCards(false)">전체 접기</button>
    </div>
  </div>

  <!-- 1. 영상 속 실전 대사 섹션 -->
  <div class="section-title">🎬 영상 속 실전 대화</div>
  <div id="dialogueList" class="dialogue-list"></div>

  <!-- 2. 함께 익히면 좋은 추가 표현 섹션 -->
  <div class="section-title">➕ 함께 익히면 좋은 추가 표현</div>
  <div id="extraList" class="dialogue-list"></div>
</div>

<script src="data.js"></script>

<script>
  // data.js의 situationsData를 lectures 변수로 연동
  const lectures = (typeof situationsData !== "undefined") ? situationsData.map(item => ({
    dayFormatted: `SITUATION ${String(item.id).padStart(2, '0')}`,
    title: `[${item.category}] ${item.title} (${item.page || ''})`,
    tip: item.tip || "",
    dialogues: item.dialogues || [],
    extras: (item.extras || []).map(ex => ({ role: "EXTRA", roleLabel: "추가", kr: ex.kr, en: ex.en, note: "" }))
  })) : [];

  let currentLectureIndex = 0;
  let isPlayingAll = false;
  let currentPlayIndex = 0;
  let femaleVoice = null;
  let maleVoice = null;
  let recognition = null;
  let activeRecordingIdx = null;
  let speechSilenceTimer = null;
  let accumulatedTranscript = "";

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
  }

  function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    const enVoices = voices.filter(v => v.lang.startsWith("en"));
    femaleVoice = enVoices.find(v => /Google US English|Aria|Jenny|Samantha|Zira/i.test(v.name)) || enVoices[0] || null;
    maleVoice = enVoices.find(v => /Google US English|David|Guy|Christopher|Alex/i.test(v.name)) || enVoices[1] || enVoices[0] || null;

    const statusEl = document.getElementById("voiceStatus");
    if (statusEl) {
      statusEl.textContent = enVoices.length > 0 ? "🎙️ 음성 엔진 준비 완료" : "🎙️ 기본 음성 사용 모드";
    }
  }
  window.speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 300);

  function initLectureSelect() {
    const select = document.getElementById("lectureSelect");
    if (!select || lectures.length === 0) return;
    select.innerHTML = lectures.map((lec, idx) => `
      <option value="${idx}">${lec.dayFormatted} : ${lec.title}</option>
    `).join("");
    updateNavButtons();
  }

  function updateNavButtons() {
    const prevBtn = document.getElementById("headerPrevBtn");
    const nextBtn = document.getElementById("headerNextBtn");
    if (prevBtn) prevBtn.disabled = (currentLectureIndex <= 0);
    if (nextBtn) nextBtn.disabled = (currentLectureIndex >= lectures.length - 1);
  }

  function navLecture(delta) {
    const targetIdx = currentLectureIndex + delta;
    if (targetIdx >= 0 && targetIdx < lectures.length) {
      document.getElementById("lectureSelect").value = targetIdx;
      changeLecture(targetIdx);
    }
  }

  function changeLecture(index) {
    if (isPlayingAll) stopPlayAll();
    currentLectureIndex = parseInt(index);
    const lec = lectures[currentLectureIndex];
    document.getElementById("lectureTitle").textContent = `✈️ ${lec.dayFormatted} : ${lec.title}`;
    updateNavButtons();
    renderContent();
  }

  function buildCardHtml(item, globalIdx, isExtra = false) {
    const typePrefix = isExtra ? 'extra' : 'diag';
    const uniqueId = `${typePrefix}-${globalIdx}`;

    return `
      <div class="card" id="card-${uniqueId}">
        <div class="card-main-row">
          <div class="kr-container">
            <button class="toggle-btn" onclick="toggleCard('${uniqueId}')" title="정답 토글">▶</button>
            <span class="speaker-badge speaker-${item.role}">${item.roleLabel || item.role}</span>
            <div class="kr-text-wrap">
              <div class="kr-text">${item.kr}</div>
            </div>
          </div>
          <div class="actions-wrap">
            <button class="btn-record" id="rec-btn-${uniqueId}" onclick="startSpeaking('${uniqueId}', ${globalIdx}, ${isExtra})">
              🎙️ 말하기
            </button>
          </div>
        </div>

        <div class="analysis-panel" id="analysis-${uniqueId}">
          <div class="panel-header">
            <span>🗣️ 내 발화 분석 결과</span>
            <span class="score-badge" id="score-${uniqueId}">일치도: -%</span>
          </div>
          <div class="speech-transcript" id="transcript-${uniqueId}">인식 중...</div>
          <div class="diff-box" id="diff-${uniqueId}"></div>
        </div>

        <div class="en-panel">
          <div class="en-row">
            <span class="en-text">${item.en}</span>
            <button class="btn-tts" onclick="speakSingle('${uniqueId}', ${globalIdx}, ${isExtra})">🔊 원문 듣기</button>
          </div>
          ${item.note ? `
            <div class="note-box">
              <div class="note-title">💡 학습 TIP</div>
              <div>${item.note}</div>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  function renderContent() {
    const lec = lectures[currentLectureIndex];
    const dialogueListEl = document.getElementById("dialogueList");
    const extraListEl = document.getElementById("extraList");

    if (dialogueListEl) {
      dialogueListEl.innerHTML = lec.dialogues.map((item, idx) => buildCardHtml(item, idx, false)).join("");
    }
    if (extraListEl) {
      if (lec.extras && lec.extras.length > 0) {
        extraListEl.innerHTML = lec.extras.map((item, idx) => buildCardHtml(item, idx, true)).join("");
      } else {
        extraListEl.innerHTML = `<div style="color:var(--text-sub); padding:10px;">등록된 추가 표현이 없습니다.</div>`;
      }
    }
  }

  function toggleCard(uniqueId) {
    document.getElementById(`card-${uniqueId}`).classList.toggle("open");
  }

  function toggleAllCards(open) {
    document.querySelectorAll(".card").forEach(card => {
      if (open) card.classList.add("open");
      else card.classList.remove("open");
    });
  }

  function speakText(text, role, onEnd) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    utter.rate = 0.95;
    if (role === "B" || String(role).toUpperCase().includes("B")) {
      if (maleVoice) utter.voice = maleVoice;
      utter.pitch = 0.88;
    } else {
      if (femaleVoice) utter.voice = femaleVoice;
      utter.pitch = 1.1;
    }
    if (onEnd) {
      utter.onend = onEnd;
      utter.onerror = onEnd;
    }
    window.speechSynthesis.speak(utter);
  }

  function speakSingle(uniqueId, idx, isExtra) {
    if (isPlayingAll) stopPlayAll();
    const lec = lectures[currentLectureIndex];
    const item = isExtra ? lec.extras[idx] : lec.dialogues[idx];
    const card = document.getElementById(`card-${uniqueId}`);
    
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active-playing"));
    card.classList.add("active-playing");
    speakText(item.en, item.role, () => {
      card.classList.remove("active-playing");
    });
  }

  function togglePlayAll() {
    if (isPlayingAll) stopPlayAll();
    else startPlayAll();
  }

  function startPlayAll() {
    isPlayingAll = true;
    currentPlayIndex = 0;
    const btn = document.getElementById("playAllBtn");
    btn.innerHTML = "⏹ 연속 듣기 정지";
    btn.classList.add("playing");
    toggleAllCards(true);
    playNextInSequence();
  }

  function stopPlayAll() {
    isPlayingAll = false;
    window.speechSynthesis.cancel();
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active-playing"));
    const btn = document.getElementById("playAllBtn");
    if (btn) {
      btn.innerHTML = "▶ 대화 전체 연속 듣기 (역할 롤플레이)";
      btn.classList.remove("playing");
    }
  }

  function playNextInSequence() {
    const lec = lectures[currentLectureIndex];
    if (!isPlayingAll || currentPlayIndex >= lec.dialogues.length) {
      stopPlayAll();
      return;
    }
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active-playing"));
    const uniqueId = `diag-${currentPlayIndex}`;
    const card = document.getElementById(`card-${uniqueId}`);
    if (card) {
      card.classList.add("active-playing");
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    const item = lec.dialogues[currentPlayIndex];
    speakText(item.en, item.role, () => {
      if (!isPlayingAll) return;
      currentPlayIndex++;
      setTimeout(playNextInSequence, 550);
    });
  }

  function startSpeaking(uniqueId, idx, isExtra) {
    if (!recognition) {
      alert("현재 브라우저에서는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 이용해 주세요.");
      return;
    }

    if (activeRecordingIdx !== null) {
      if (activeRecordingIdx === uniqueId) {
        finishSpeaking(uniqueId, idx, isExtra);
      } else {
        recognition.stop();
      }
      return;
    }

    activeRecordingIdx = uniqueId;
    accumulatedTranscript = "";
    if (speechSilenceTimer) clearTimeout(speechSilenceTimer);

    const btn = document.getElementById(`rec-btn-${uniqueId}`);
    btn.classList.add("recording");
    btn.innerHTML = "⏹️ 완료";

    const panel = document.getElementById(`analysis-${uniqueId}`);
    panel.classList.add("show");
    document.getElementById(`transcript-${uniqueId}`).innerHTML = `<strong>인식 중...</strong> <span style="color:#0284c7;">말씀해 보세요.</span>`;

    recognition.onresult = (event) => {
      let interim = "";
      let final = "";

      for (let i = 0; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          final += event.results[i][0].transcript + " ";
        } else {
          interim += event.results[i][0].transcript;
        }
      }

      accumulatedTranscript = (final + interim).trim();
      document.getElementById(`transcript-${uniqueId}`).innerHTML = `<strong>인식된 문장:</strong> "${accumulatedTranscript}"`;

      if (speechSilenceTimer) clearTimeout(speechSilenceTimer);
      speechSilenceTimer = setTimeout(() => {
        finishSpeaking(uniqueId, idx, isExtra);
      }, 3000);
    };

    recognition.onerror = (event) => {
      console.error(event.error);
      if (event.error !== "no-speech") {
        alert("음성 인식 오류: " + event.error);
      }
      resetRecButton(uniqueId);
      activeRecordingIdx = null;
    };

    recognition.onend = () => {
      if (activeRecordingIdx !== null && accumulatedTranscript) {
        analyzeSpeech(uniqueId, idx, isExtra, accumulatedTranscript);
      }
      resetRecButton(uniqueId);
      activeRecordingIdx = null;
    };

    recognition.start();
  }

  function finishSpeaking(uniqueId, idx, isExtra) {
    if (speechSilenceTimer) clearTimeout(speechSilenceTimer);
    recognition.stop();
    resetRecButton(uniqueId);
    if (accumulatedTranscript) {
      analyzeSpeech(uniqueId, idx, isExtra, accumulatedTranscript);
    }
    activeRecordingIdx = null;
  }

  function resetRecButton(uniqueId) {
    const btn = document.getElementById(`rec-btn-${uniqueId}`);
    if (btn) {
      btn.classList.remove("recording");
      btn.innerHTML = "🎙️ 말하기";
    }
  }

  function cleanText(str) {
    return str.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
  }

  function analyzeSpeech(uniqueId, idx, isExtra, userSpoken) {
    const lec = lectures[currentLectureIndex];
    const item = isExtra ? lec.extras[idx] : lec.dialogues[idx];
    const targetEn = item.en;

    const targetWords = cleanText(targetEn).split(/\s+/);
    const spokenWords = cleanText(userSpoken).split(/\s+/);

    let matchCount = 0;
    const diffHtmlParts = [];

    targetWords.forEach(w => {
      if (spokenWords.includes(w)) {
        matchCount++;
        diffHtmlParts.push(`<span class="match-word">${w}</span>`);
      } else {
        diffHtmlParts.push(`<span class="miss-word">${w}</span>`);
      }
    });

    const score = Math.round((matchCount / targetWords.length) * 100);

    const panel = document.getElementById(`analysis-${uniqueId}`);
    panel.classList.add("show");

    const scoreEl = document.getElementById(`score-${uniqueId}`);
    scoreEl.textContent = `일치도: ${score}%`;
    scoreEl.className = "score-badge " + (score >= 80 ? "score-high" : score >= 50 ? "score-mid" : "score-low");

    document.getElementById(`transcript-${uniqueId}`).innerHTML = `<strong>인식된 문장:</strong> "${userSpoken}"`;
    document.getElementById(`diff-${uniqueId}`).innerHTML = `
      <div style="font-size:0.82rem; color:#64748b; margin-bottom:4px;">목표 문장 대조 (<span style="color:#16a34a">초록: 일치</span>, <span style="color:#dc2626; text-decoration:line-through">빨강: 누락/오류</span>):</div>
      ${diffHtmlParts.join(" ")}
    `;

    document.getElementById(`card-${uniqueId}`).classList.add("open");
  }

  if (typeof situationsData !== "undefined" && situationsData.length > 0) {
    initLectureSelect();
    changeLecture(0);
  } else {
    document.getElementById("dialogueList").innerHTML = `<div style="padding:20px; text-align:center;">⚠️ data.js 파일을 불러오지 못했습니다. 파일 이름을 확인해 주세요.</div>`;
  }
</script>

</body>
</html>

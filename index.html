<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실전 여행 영어 - AI 롤플레이 & 말하기 트레이너</title>
  <style>
    :root {
      --primary: #0284c7; /* 여행 테마 시그니처 오션 블루 */
      --primary-hover: #0369a1;
      --primary-light: #f0f9ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --role-a: #0ea5e9; /* 여행자/손님 */
      --role-b: #f59e0b; /* 현지 직원/승무원/호스트 */
      --success: #059669;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 16px;
      line-height: 1.6;
    }

    .container { max-width: 820px; margin: 0 auto; }

    header {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.06);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0369a1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lecture-select-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    select {
      padding: 8px 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      border: 2px solid var(--primary);
      background-color: #fff;
      color: var(--primary);
      outline: none;
      cursor: pointer;
    }

    .desc { font-size: 0.9rem; color: var(--text-sub); }

    .voice-status {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.8rem;
      padding: 4px 12px;
      background: #f0f9ff;
      border-radius: 20px;
      color: #0369a1;
    }

    /* 툴바 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: white;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 9px 15px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-primary.playing { background-color: var(--danger); }

    .btn-secondary { background-color: #f1f5f9; color: #334155; }
    .btn-secondary:hover { background-color: #e2e8f0; }

    .btn-nav {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 8px 12px;
      font-size: 0.88rem;
      border: 1px solid #bae6fd;
    }
    .btn-nav:hover { background-color: #e0f2fe; }

    /* 다이얼로그 카드 */
    .dialogue-list { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px 20px;
      border: 2px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: all 0.25s ease;
    }

    .card.active-playing {
      border-color: var(--primary);
      background-color: #f0f9ff;
      transform: scale(1.008);
    }

    .card-main-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .kr-container { display: flex; align-items: flex-start; gap: 10px; flex: 1; }

    .toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: var(--primary-light);
      color: var(--primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .card.open .toggle-btn {
      transform: rotate(90deg);
      background-color: var(--primary);
      color: white;
    }

    .speaker-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      color: white;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .speaker-A { background-color: var(--role-a); }
    .speaker-B { background-color: var(--role-b); }

    .kr-text-wrap { flex: 1; }
    .kr-text { font-size: 1.1rem; font-weight: 700; color: #0f172a; line-height: 1.45; }

    .actions-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn-record {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .btn-record:hover { background-color: #fee2e2; }
    .btn-record.recording {
      background-color: #dc2626;
      color: white;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .yt-link {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-decoration: none;
      background: #f1f5f9;
      padding: 6px 9px;
      border-radius: 8px;
    }
    .yt-link:hover { background: #e2e8f0; color: #0f172a; }

    /* 말하기 분석 결과 패널 */
    .analysis-panel {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
    }
    .analysis-panel.show { display: block; }

    .panel-header {
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .score-badge { padding: 2px 8px; border-radius: 20px; font-weight: 800; }
    .score-high { background: #dcfce7; color: #15803d; }
    .score-mid { background: #fef3c7; color: #b45309; }
    .score-low { background: #fee2e2; color: #b91c1c; }

    .speech-transcript { font-size: 0.95rem; margin-bottom: 8px; color: #334155; }
    .diff-box {
      font-size: 0.92rem;
      padding: 8px 12px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      line-height: 1.5;
    }
    .match-word { color: #16a34a; font-weight: 700; }
    .miss-word { color: #dc2626; text-decoration: line-through; margin-right: 4px; }

    /* 영어 정답 패널 */
    .en-panel {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }
    .card.open .en-panel { display: block; }

    .en-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .en-text { font-size: 1.15rem; font-weight: 700; color: #0f172a; }

    .btn-tts {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 6px 11px;
      font-size: 0.85rem;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .btn-tts:hover { background-color: #e0f2fe; }

    .note-box {
      background-color: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .note-title { font-weight: 700; color: #0369a1; margin-bottom: 4px; }

    .extras-list {
      list-style: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .extra-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #475569;
    }
    .extra-item strong { color: #0f172a; }

    .btn-mini-tts {
      background: #e2e8f0;
      color: #334155;
      padding: 2px 7px;
      font-size: 0.75rem;
      border-radius: 4px;
    }
    .btn-mini-tts:hover { background: #cbd5e1; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-top">
      <h1 id="lectureTitle">✈️ 실전 여행 영어 회화</h1>
      <div class="lecture-select-box">
        <button id="headerPrevBtn" class="btn-nav" onclick="navLecture(-1)" title="이전 강의">◀ 이전</button>
        <select id="lectureSelect" onchange="changeLecture(this.value)"></select>
        <button id="headerNextBtn" class="btn-nav" onclick="navLecture(1)" title="다음 강의">다음 ▶</button>
      </div>
    </div>
    <p class="desc">상황별 여행 영어 표현을 보고 [🎙️ 말하기]를 눌러 영작을 시도해 보세요. 3초간 말이 없거나 [⏹️ 완료]를 누르면 즉시 분석 채점됩니다.</p>
    <div id="voiceStatus" class="voice-status">음성 엔진 준비 중...</div>
  </header>

  <div class="toolbar">
    <div class="btn-group">
      <button id="playAllBtn" class="btn-primary" onclick="togglePlayAll()">
        ▶ 대화 전체 연속 듣기 (역할 롤플레이)
      </button>
    </div>
    <div class="btn-group">
      <button class="btn-secondary" onclick="toggleAllCards(true)">전체 정답 열기</button>
      <button class="btn-secondary" onclick="toggleAllCards(false)">전체 접기</button>
    </div>
  </div>

  <div id="dialogueList" class="dialogue-list"></div>
</div>

<script src="data.js"></script>

<script>
  let currentLectureIndex = 0;
  let isPlayingAll = false;
  let currentPlayIndex = 0;
  let femaleVoice = null;
  let maleVoice = null;
  let recognition = null;
  let activeRecordingIdx = null;
  let speechSilenceTimer = null;
  let accumulatedTranscript = "";

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
  }

  function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    const enVoices = voices.filter(v => v.lang.startsWith("en"));
    const femaleKeywords = ["Female", "Zira", "Samantha", "Victoria", "Karen", "Tessa", "Google US English", "Aria", "Jenny"];
    const maleKeywords = ["Male", "David", "Mark", "Alex", "Daniel", "Guy", "Christopher", "Jacob"];

    femaleVoice = enVoices.find(v => femaleKeywords.some(k => v.name.includes(k))) || enVoices[0] || null;
    maleVoice = enVoices.find(v => v !== femaleVoice && maleKeywords.some(k => v.name.includes(k))) || enVoices.find(v => v !== femaleVoice) || femaleVoice;

    const statusEl = document.getElementById("voiceStatus");
    if (femaleVoice && maleVoice) {
      statusEl.textContent = `🎙️ TTS 음성 연동 완료: 역할 A [${femaleVoice.name.split(' ')[0]}] / 역할 B [${maleVoice.name.split(' ')[0]}]`;
    } else {
      statusEl.textContent = `🎙️ 기본 TTS 엔진 준비 완료 (피치 조절 모드)`;
    }
  }

  window.speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 300);

  function initLectureSelect() {
    const select = document.getElementById("lectureSelect");
    select.innerHTML = lectures.map((lec, idx) => `
      <option value="${idx}">${lec.dayFormatted || 'DAY ' + (idx + 1)} : ${lec.title}</option>
    `).join("");
    updateNavButtons();
  }

  function updateNavButtons() {
    const prevBtn = document.getElementById("headerPrevBtn");
    const nextBtn = document.getElementById("headerNextBtn");
    if (prevBtn) prevBtn.disabled = (currentLectureIndex <= 0);
    if (nextBtn) nextBtn.disabled = (currentLectureIndex >= lectures.length - 1);
  }

  function navLecture(delta) {
    const targetIdx = currentLectureIndex + delta;
    if (targetIdx >= 0 && targetIdx < lectures.length) {
      document.getElementById("lectureSelect").value = targetIdx;
      changeLecture(targetIdx);
    }
  }

  function changeLecture(index) {
    if (isPlayingAll) stopPlayAll();
    currentLectureIndex = parseInt(index);
    const lec = lectures[currentLectureIndex];
    document.getElementById("lectureTitle").textContent = `✈️ ${lec.dayFormatted || 'DAY ' + (currentLectureIndex + 1)} : ${lec.title}`;
    updateNavButtons();
    renderDialogues();
  }

  function renderDialogues() {
    const lec = lectures[currentLectureIndex];
    const listEl = document.getElementById("dialogueList");

    listEl.innerHTML = lec.dialogues.map((item, idx) => {
      const extrasHtml = item.extras && item.extras.length > 0 ? `
        <ul class="extras-list">
          ${item.extras.map(ex => `
            <li class="extra-item">
              <span>➕ <strong>${ex.en}</strong> : ${ex.kr}</span>
              <button class="btn-mini-tts" onclick="speakText('${ex.en.replace(/'/g, "\\'")}', '${item.role}')">🔊 듣기</button>
            </li>
          `).join("")}
        </ul>
      ` : "";

      const ytLinkHtml = lec.videoId && item.seconds !== undefined ? `
        <a class="yt-link" href="https://youtu.be/${lec.videoId}?t=${item.seconds}" target="_blank" title="유튜브 해설 구간 이동">
          ⏱️ ${item.time || '영상'}
        </a>
      ` : "";

      return `
        <div class="card" id="card-${idx}">
          <div class="card-main-row">
            <div class="kr-container">
              <button class="toggle-btn" onclick="toggleCard(${idx})" title="정답 토글">▶</button>
              <span class="speaker-badge speaker-${item.role}">${item.roleLabel || item.role}</span>
              <div class="kr-text-wrap">
                <div class="kr-text">${item.kr}</div>
              </div>
            </div>
            <div class="actions-wrap">
              <button class="btn-record" id="rec-btn-${idx}" onclick="startSpeaking(${idx})">
                🎙️ 말하기
              </button>
              ${ytLinkHtml}
            </div>
          </div>

          <div class="analysis-panel" id="analysis-${idx}">
            <div class="panel-header">
              <span>🗣️ 내 발화 분석 결과</span>
              <span class="score-badge" id="score-${idx}">일치도: -%</span>
            </div>
            <div class="speech-transcript" id="transcript-${idx}">인식 중...</div>
            <div class="diff-box" id="diff-${idx}"></div>
          </div>

          <div class="en-panel">
            <div class="en-row">
              <span class="en-text">${item.en}</span>
              <button class="btn-tts" onclick="speakSingle(${idx})">🔊 원문 듣기</button>
            </div>
            <div class="note-box">
              <div class="note-title">💡 ${item.note || '여행 핵심 표현'}</div>
              ${extrasHtml}
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function toggleCard(idx) {
    document.getElementById(`card-${idx}`).classList.toggle("open");
  }

  function toggleAllCards(open) {
    const lec = lectures[currentLectureIndex];
    lec.dialogues.forEach((_, idx) => {
      const card = document.getElementById(`card-${idx}`);
      if (open) card.classList.add("open");
      else card.classList.remove("open");
    });
  }

  function speakText(text, role, onEnd) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    if (role === "A") {
      if (femaleVoice) utter.voice = femaleVoice;
      utter.pitch = 1.12;
      utter.rate = 0.95;
    } else {
      if (maleVoice) utter.voice = maleVoice;
      utter.pitch = 0.88;
      utter.rate = 0.93;
    }
    if (onEnd) {
      utter.onend = onEnd;
      utter.onerror = onEnd;
    }
    window.speechSynthesis.speak(utter);
  }

  function speakSingle(idx) {
    if (isPlayingAll) stopPlayAll();
    const lec = lectures[currentLectureIndex];
    const item = lec.dialogues[idx];
    const card = document.getElementById(`card-${idx}`);
    clearActiveHighlight();
    card.classList.add("active-playing");
    speakText(item.en, item.role, () => {
      card.classList.remove("active-playing");
    });
  }

  function clearActiveHighlight() {
    const lec = lectures[currentLectureIndex];
    lec.dialogues.forEach((_, idx) => {
      document.getElementById(`card-${idx}`).classList.remove("active-playing");
    });
  }

  function togglePlayAll() {
    if (isPlayingAll) stopPlayAll();
    else startPlayAll();
  }

  function startPlayAll() {
    isPlayingAll = true;
    currentPlayIndex = 0;
    const btn = document.getElementById("playAllBtn");
    btn.innerHTML = "⏹ 연속 듣기 정지";
    btn.classList.add("playing");
    toggleAllCards(true);
    playNextInSequence();
  }

  function stopPlayAll() {
    isPlayingAll = false;
    window.speechSynthesis.cancel();
    clearActiveHighlight();
    const btn = document.getElementById("playAllBtn");
    btn.innerHTML = "▶ 대화 전체 연속 듣기 (역할 롤플레이)";
    btn.classList.remove("playing");
  }

  function playNextInSequence() {
    const lec = lectures[currentLectureIndex];
    if (!isPlayingAll || currentPlayIndex >= lec.dialogues.length) {
      stopPlayAll();
      return;
    }
    clearActiveHighlight();
    const card = document.getElementById(`card-${currentPlayIndex}`);
    card.classList.add("active-playing");
    card.scrollIntoView({ behavior: "smooth", block: "center" });

    const item = lec.dialogues[currentPlayIndex];
    speakText(item.en, item.role, () => {
      if (!isPlayingAll) return;
      currentPlayIndex++;
      setTimeout(playNextInSequence, 550);
    });
  }

  function startSpeaking(idx) {
    if (!recognition) {
      alert("현재 브라우저에서는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 이용해 주세요.");
      return;
    }

    if (activeRecordingIdx !== null) {
      if (activeRecordingIdx === idx) {
        finishSpeaking(idx);
      } else {
        recognition.stop();
      }
      return;
    }

    activeRecordingIdx = idx;
    accumulatedTranscript = "";
    if (speechSilenceTimer) clearTimeout(speechSilenceTimer);

    const btn = document.getElementById(`rec-btn-${idx}`);
    btn.classList.add("recording");
    btn.innerHTML = "⏹️ 말하기 완료";

    const panel = document.getElementById(`analysis-${idx}`);
    panel.classList.add("show");
    document.getElementById(`transcript-${idx}`).innerHTML = `<strong>인식 중...</strong> <span style="color:#0284c7;">말씀해 보세요.</span>`;

    recognition.onresult = (event) => {
      let interim = "";
      let final = "";

      for (let i = 0; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          final += event.results[i][0].transcript + " ";
        } else {
          interim += event.results[i][0].transcript;
        }
      }

      accumulatedTranscript = (final + interim).trim();
      document.getElementById(`transcript-${idx}`).innerHTML = `<strong>인식된 문장:</strong> "${accumulatedTranscript}"`;

      if (speechSilenceTimer) clearTimeout(speechSilenceTimer);
      speechSilenceTimer = setTimeout(() => {
        finishSpeaking(idx);
      }, 3000);
    };

    recognition.onerror = (event) => {
      console.error(event.error);
      if (event.error !== "no-speech") {
        alert("음성 인식 오류: " + event.error);
      }
      resetRecButton(idx);
      activeRecordingIdx = null;
    };

    recognition.onend = () => {
      if (activeRecordingIdx !== null && accumulatedTranscript) {
        analyzeSpeech(idx, accumulatedTranscript);
      }
      resetRecButton(idx);
      activeRecordingIdx = null;
    };

    recognition.start();
  }

  function finishSpeaking(idx) {
    if (speechSilenceTimer) clearTimeout(speechSilenceTimer);
    recognition.stop();
    resetRecButton(idx);
    if (accumulatedTranscript) {
      analyzeSpeech(idx, accumulatedTranscript);
    }
    activeRecordingIdx = null;
  }

  function resetRecButton(idx) {
    const btn = document.getElementById(`rec-btn-${idx}`);
    if (btn) {
      btn.classList.remove("recording");
      btn.innerHTML = "🎙️ 말하기";
    }
  }

  function cleanText(str) {
    return str.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
  }

  function analyzeSpeech(idx, userSpoken) {
    const lec = lectures[currentLectureIndex];
    const targetEn = lec.dialogues[idx].en;

    const targetWords = cleanText(targetEn).split(/\s+/);
    const spokenWords = cleanText(userSpoken).split(/\s+/);

    let matchCount = 0;
    const diffHtmlParts = [];

    targetWords.forEach(w => {
      if (spokenWords.includes(w)) {
        matchCount++;
        diffHtmlParts.push(`<span class="match-word">${w}</span>`);
      } else {
        diffHtmlParts.push(`<span class="miss-word">${w}</span>`);
      }
    });

    const score = Math.round((matchCount / targetWords.length) * 100);

    const panel = document.getElementById(`analysis-${idx}`);
    panel.classList.add("show");

    const scoreEl = document.getElementById(`score-${idx}`);
    scoreEl.textContent = `일치도: ${score}%`;
    scoreEl.className = "score-badge " + (score >= 80 ? "score-high" : score >= 50 ? "score-mid" : "score-low");

    document.getElementById(`transcript-${idx}`).innerHTML = `<strong>인식된 문장:</strong> "${userSpoken}"`;
    document.getElementById(`diff-${idx}`).innerHTML = `
      <div style="font-size:0.82rem; color:#64748b; margin-bottom:4px;">목표 문장 대조 (<span style="color:#16a34a">초록: 일치</span>, <span style="color:#dc2626; text-decoration:line-through">빨강: 누락/오류</span>):</div>
      ${diffHtmlParts.join(" ")}
    `;

    document.getElementById(`card-${idx}`).classList.add("open");
  }

  initLectureSelect();
  renderDialogues();
</script>

</body>
</html>
